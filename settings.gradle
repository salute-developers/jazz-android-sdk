pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Здесь указан репозиторий с которого можно скачать все необходимые зависимости, что бы не делать excludeGroup
        // достаточно поставить наш репозиторий выше других
        maven {
            url "https://public.repo.dp.s2b.tech/repo/public/repository/jazz-maven/"
        }

        google() {
            content { excludeGroup("com.facebook.react") }
        }
        mavenCentral() {
            content { excludeGroup("com.facebook.react") }
        }
        jcenter() {
            content { excludeGroup("com.facebook.react") }
        }


    }
}
rootProject.name = "jazz-testapp"
include ':app'
